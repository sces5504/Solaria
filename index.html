 for(const id of Object.keys(els)){if(!els[id])continue;const type={fire:'flare',ice:'frostburst',water:'splash',lightning:'shock',bleed:'bloodspray'}[id];if(type)addFx({type,x:target.x,y:target.y-8,color:elements[id].color,life:.55,maxLife:.55,seed:fxRand()*6.28})}
}
function chainLightning(target,owner,power,wet){
 const pool=target.team==='enemy'?game.enemies:[game.player],visited=new Set([target]);let current=target;
 const count=Math.min(12,(wet?CFG.chainTargets:2)+(owner?.team==='player'?game.stats.extraChain:0)),range=CFG.chainRange+(owner?.team==='player'?lv('conduct')*25:0);
 for(let i=0;i<count;i++){
  const next=pool.filter(e=>e.alive&&!visited.has(e)&&dist(e,current)<=range).sort((a,b)=>dist(a,current)-dist(b,current))[0];if(!next)break;
  addFx({type:'bolt',x:current.x,y:current.y-10,x2:next.x,y2:next.y-10,color:elements.lightning.color,life:.65,maxLife:.65});
  addFx({type:'shock',x:next.x,y:next.y-8,color:elements.lightning.color,life:.4,maxLife:.4,seed:fxRand()*6.28});
  visited.add(next);damage(next,(wet?12:6)*power,owner,'lightning',true);current=next;
 }
 if(wet)emitEffect('text',target.x,target.y-35,elements.lightning.color,'感電連鎖',.8);
}
